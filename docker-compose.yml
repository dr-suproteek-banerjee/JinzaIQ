services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:///./japantech.db
      JWT_SECRET: local-dev-secret-change-me
      AI_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: japantech
      POSTGRES_PASSWORD: japantech
      POSTGRES_DB: japantech
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
